global
        log /dev/log local0
        log /dev/log local1 notice

        stats socket ipv4@127.0.0.1:9999 level admin
        stats socket /run/haproxy/admin.sock mode 660 level admin
        stats timeout 2m

        user haproxy
        group haproxy

        lua-load-per-thread /etc/haproxy/mylualib.lua


defaults
        log global
        mode http
        option httplog
        option dontlognull
        timeout connect 5000
        timeout client  50000
        timeout server  50000
        timeout client 1m
        timeout server 1m
        timeout connect 10s
        timeout http-keep-alive 2m
        timeout queue 15s
        timeout tunnel 4h  # for websocket


frontend stats
  bind :8888
  stats enable
  stats refresh 60s
  stats uri /stats
  stats show-modules

frontend http-in
  bind :80
  use_backend direct-backend if { path_beg /direct }
  use_backend webapp-backend if { path_beg /webapp/ }
  default_backend default-backend

  http-request set-var(txn.useragent) req.hdr(user-agent)
  http-request set-var(txn.srcip) src
  http-request set-var(txn.begin) date(0,us)
  http-request lua.atrequest
  http-response set-var(txn.end) date(0,us)
  http-response set-var(txn.dur) var(txn.end),sub(txn.begin)
  http-response lua.atresponse
  http-response set-var(txn.mymessage) var(txn.useragent),concat(:),concat(,txn.srcip),concat(:),concat(,txn.dur),,concat(:),concat(,txn.mykey),concat(:),concat(,txn.myclocks)
  http-response add-header X-mymessage %[var(txn.mymessage)]

  http-request use-service lua.hello_world_http if { path_beg /lua }


backend default-backend
  option httpchk
  server apache-a apache:80 check

backend direct-backend
  http-request return status 200 content-type "text/plain" string "Moin from haproxy\n"


backend webapp-backend
  option httpchk
  server apache2 apache:8080 check
